org.gradle.configuration-cache=true
# Stores and loads configuration cache entries in parallel.
org.gradle.configuration-cache.parallel=true
org.gradle.parallel=true
org.gradle.caching=true
# Gradle's embedded Kotlin compiler (build scripts, ktlint) still calls sun.misc.Unsafe, which JDK 25
# warns about on every run; allow it quietly. The Kotlin daemon inherits these arguments. Needs JDK 23+.
org.gradle.jvmargs=-Dfile.encoding=UTF-8 --sun-misc-unsafe-memory-access=allow

# The one place the version is set. Between releases it is the snapshot of the next patch release, X.Y.Z-SNAPSHOT;
# the release workflow (./gradlew releaseDist) releases it as X.Y.Z and moves it on to X.Y.(Z+1)-SNAPSHOT.
rylween.version=0.9.2-SNAPSHOT
