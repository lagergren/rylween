[versions]
jdk = "25"
kotlin = "2.3.21"
jline = "4.0.12"
nodejs = "24.6.0"
node-gradle = "7.1.0"
playwright = "1.49.0"
gradle-versions = "0.54.0"
version-catalog-update = "1.1.0"

[libraries]
jline = { module = "org.jline:jline", version.ref = "jline" }
playwright = { module = "com.microsoft.playwright:playwright", version.ref = "playwright" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
node = { id = "com.github.node-gradle.node", version.ref = "node-gradle" }
gradle-versions = { id = "com.github.ben-manes.versions", version.ref = "gradle-versions" }
version-catalog-update = { id = "nl.littlerobots.version-catalog-update", version.ref = "version-catalog-update" }
