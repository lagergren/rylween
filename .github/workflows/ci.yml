# Kotlin DSL/runtime gate.

name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: check
        run: ./gradlew check installKotlinAnsi --console=plain

      - name: whitespace
        run: git diff --check
