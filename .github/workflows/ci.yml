# Kotlin DSL/runtime gate plus self-contained ANSI Docker image.

name: ci

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  kotlin:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - uses: gradle/actions/setup-gradle@v4

      - name: check
        run: ./gradlew check installKotlinAnsi --console=plain

      - name: ansi launcher smoke
        run: ./build/install/rylween-kotlin/bin/rylween-app --help >/dev/null

      - name: whitespace
        run: git diff --check

  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: docker/setup-buildx-action@v3

      - name: build runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: rylween:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: smoke
        run: docker run --rm rylween:ci --help >/dev/null
